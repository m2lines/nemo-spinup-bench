# DINO-evaluation-1m.yaml
# Configured for the 1-month resampled data

mesh_mask: mesh_mask.nc

restart_files: 'restart'

output_variables:
  temperature:
    file: resampled/DINO_1m_grid_T_3D.nc
    var: toce_inst
  salinity:
    file: resampled/DINO_1m_grid_T_3D.nc
    var: soce_inst
  ssh:
    file: DINO_1m_grid_T_2D.nc
    var: ssh
  velocity_u:
    file: resampled/DINO_1m_grid_U_3D.nc
    var: uoce_inst
  velocity_v:
    file: resampled/DINO_1m_grid_V_3D.nc
    var: voce_inst
